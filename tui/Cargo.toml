[package]
name = "tui"
version.workspace = true
edition.workspace = true

[dependencies]
server = { path = "../server" }
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
clap = { version = "4.6.6", features = ["derive"] }
common.workspace = true
futures-util = "0.3.34"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
ratatui = "0.30.2"
ratatui-image = { version = "11.0.6", default-features = false, features = ["crossterm"] }
rodio = { version = "0.22.2", default-features = false, features = ["playback", "recording", "wav"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time", "sync", "net"] }
tokio-tungstenite = "0.30.0"
toml = "1.1.4"
unicode-width = "0.2.2"
uuid.workspace = true
axum = "0.8.9"
# Из умолчаний выброшены metrics (счётчики, которые мы нигде не показываем) и
# fast-apple-datapath (ускорение сокетов macOS — на Windows и Linux мёртвый вес).
# portmapper оставлен намеренно: он просит роутер открыть порт и заметно
# повышает долю прямых соединений вместо релея.
iroh = { version = "1.1.0", default-features = false, features = ["tls-ring", "portmapper"] }

[dev-dependencies]
axum = "0.8.9"
