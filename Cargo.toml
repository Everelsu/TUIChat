[workspace]
resolver = "3"
members = ["common", "server", "tui"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
common = { path = "common" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }

[profile.release]
# Размер здесь важнее скорости: чат ничего не считает, всё время он ждёт сеть
# и нажатия. `opt-level = "s"` убирает разворачивание циклов и агрессивный
# инлайнинг — на глаз разницы никакой, а мегабайты уходят.
opt-level = "s"
# Полный LTO: собирается дольше, зато выбрасывает всё, что не позвали. При
# зависимостях вроде QUIC-стека это уже не считаные проценты.
lto = "fat"
codegen-units = 1
strip = "symbols"
# panic = "abort" сюда намеренно не добавлен: на раскрутке держится то, что
# паника в рабочем потоке не убивает процесс, а превращается в сообщение
# в переписке.
